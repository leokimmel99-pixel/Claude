set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:RGB"
set -g mouse on
set -g history-limit 100000
set -g escape-time 10
set -g focus-events on
set -g extended-keys on                 # Shift+Enter etc. reach Claude Code
set -g allow-passthrough on
set -g set-clipboard on
set -g window-size latest               # laptop + second client: size to whoever typed last
setw -g aggressive-resize on
# Refresh VS Code / SSH vars on every attach so `code` and IDE lockfiles work after reconnect
set -g update-environment "DISPLAY SSH_AUTH_SOCK SSH_CONNECTION TERM_PROGRAM TERM_PROGRAM_VERSION VSCODE_IPC_HOOK_CLI VSCODE_GIT_IPC_HANDLE VSCODE_GIT_ASKPASS_NODE VSCODE_GIT_ASKPASS_MAIN GIT_ASKPASS"
set -g status-right "#S | #(tailscale status --self --peers=false 2>/dev/null | awk '{print $1}') | %H:%M"
