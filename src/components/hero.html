      <section class="hero-section" id="hero-narrative">

          <!-- Phase 1 -->
          <div class="hero-phase" id="phase-1">
            <h1 class="stagger-text">The Environment</h1>
            <h1 class="stagger-text">Is Stagnant.</h1>
            <p class="stagger-text phase-desc">Air flow restricted. Temperature imbalanced.</p>
          </div>

          <!-- Phase 2 -->
          <div class="hero-phase" id="phase-2">
            <h1 class="stagger-text">The Invisible</h1>
            <h1 class="stagger-text">Intervention.</h1>
            <p class="stagger-text phase-desc">Precision mechanics locked into place.</p>
          </div>

          <!-- Phase 3 -->
          <div class="hero-phase" id="phase-3">
            <h1 class="stagger-text">Equilibrium</h1>
            <h1 class="stagger-text">Restored.</h1>
            <p class="stagger-text phase-desc">Breath returns to the architecture.</p>
          </div>
        </div>

      <!-- Spacer for scrolling (the pinning will use this) -->
